    // Seed realistic week logs (Sat 14 -> Thu 19)
    function seedInitialLogs() {
      const set = (aid, dayIdx, status, pct = null, note = '', tvId = null) => {
        const d = DAYS[dayIdx].date;
        state.logs[`${aid}::${d}`] = { status, pct, note, targetVersionId: tvId || getActiveTarget(aid, d)?.id || null };
      };

      // Sat 14 .. Wed 18 mostly logged with realistic misses, Qadaa, and percentages
      for (let i = 0; i <= 4; i++) {
        set('fajr_sunnah', i, 'DONE');
        set('fajr_jamaah', i, i === 3 ? 'MISSED' : 'DONE');
        set('fajr_adhkar', i, 'DONE');
        set('morning_adhkar', i, i === 2 ? 'PERCENT' : 'DONE', i === 2 ? 75 : null);
        set('morning_duha', i, i === 1 ? 'QADAA_DONE' : (i === 4 ? 'MISSED' : 'DONE'));
        set('morning_istighfar', i, i === 3 ? 'PERCENT' : 'DONE', i === 3 ? 50 : null);
        set('dhuhr_sunnah_b', i, 'DONE');
        set('dhuhr_jamaah', i, 'DONE');
        set('dhuhr_adhkar', i, 'DONE');
        set('dhuhr_sunnah_a', i, i === 2 ? 'QADAA_DONE' : 'DONE');
        // Quran wird: Sat..Mon on 10 pages, Tue..Wed upgraded to 20 pages ("هدف جديد" grace!)
        if (i === 0) set('quran_wird', i, 'DONE');
        if (i === 1) set('quran_wird', i, 'MISSED'); // Open Qadaa on 10 pages!
        if (i === 2) set('quran_wird', i, 'DONE');
        if (i === 3) set('quran_wird', i, 'PERCENT', 75, 'أول يوم على 20 صفحة');
        if (i === 4) set('quran_wird', i, 'PERCENT', 60);
        set('dhuhr_sheet', i, i === 3 ? 'MISSED' : 'DONE');
        set('asr_jamaah', i, 'DONE');
        set('asr_adhkar', i, 'DONE');
        set('evening_adhkar', i, i === 1 ? 'MISSED' : (i === 4 ? 'PERCENT' : 'DONE'), i === 4 ? 50 : null);
        set('evening_istighfar', i, i === 3 ? 'MISSED' : 'DONE');
        set('maghrib_jamaah', i, 'DONE');
        set('maghrib_adhkar', i, 'DONE');
        set('maghrib_sunnah', i, 'DONE');
        set('maghrib_duaa', i, i === 2 || i === 3 ? 'MISSED' : 'DONE');
        set('isha_jamaah', i, 'DONE');
        set('isha_adhkar', i, 'DONE');
        set('isha_sunnah', i, i === 1 ? 'QADAA_DONE' : 'DONE');
        if (i < 4) set('isha_witr', i, i === 2 ? 'QADAA_DONE' : 'DONE');
        // Wed (i=4) isha_witr & isha_sheet intentionally EMPTY -> surfaces in 48h Catch-Up!
        if (i < 4) set('isha_sheet', i, 'DONE');
        set('sunan_wake', i, 'DONE');
        set('sunan_sleep', i, i === 3 ? 'PERCENT' : 'DONE', i === 3 ? 50 : null);
        set('sunan_mosque', i, 'DONE');
        set('birr_parents', i, 'DONE');
        set('wake_no_snooze', i, i === 3 || i === 4 ? 'MISSED' : 'DONE');
        if (i === 2) set('fasting', i, 'DONE'); // Monday fasting
        set('gaze', i, i === 4 ? 'PERCENT' : 'DONE', i === 4 ? 80 : null);
      }

      // Today (Thu 19): Fajr + Morning + Dhuhr done, Morning Duha left EMPTY (expired backlog!), Asr currently LIVE & unlogged!
      set('fajr_sunnah', 5, 'DONE');
      set('fajr_jamaah', 5, 'DONE');
      set('fajr_adhkar', 5, 'DONE');
      set('sunan_wake', 5, 'DONE');
      set('wake_no_snooze', 5, 'DONE');
      set('morning_adhkar', 5, 'DONE');
      // morning_duha left EMPTY on today -> expired unlogged!
      set('morning_istighfar', 5, 'PERCENT', 75);
      set('dhuhr_sunnah_b', 5, 'DONE');
      set('dhuhr_jamaah', 5, 'DONE');
      set('dhuhr_adhkar', 5, 'DONE');
      set('dhuhr_sunnah_a', 5, 'DONE');
      set('quran_wird', 5, 'PERCENT', 50, '10 من 20 صفحة قبل العصر');
      set('dhuhr_sheet', 5, 'DONE');
      set('fasting', 5, 'DONE', null, 'صيام الخميس');
    }

    // =========================================================================
    // Domain Helpers (Strict Stage 2 Rules)
    // =========================================================================
    function getAction(id) {
      return state.actions.find(a => a.id === id);
    }

    function getActiveTarget(actionId, dateStr) {
      const a = getAction(actionId);
      if (!a || !a.targets || !a.targets.length) return null;
      const eligible = a.targets.filter(t => t.from <= dateStr).sort((x, y) => x.from.localeCompare(y.from));
      return eligible.length ? eligible[eligible.length - 1] : null;
    }

    function getTargetById(actionId, tvId) {
      const a = getAction(actionId);
      if (!a || !tvId) return null;
      return a.targets.find(t => t.id === tvId) || null;
    }

    function isNewTargetGrace(action) {
      if (!action.targets || action.targets.length < 2) return false;
      const latest = action.targets[action.targets.length - 1];
      if (latest.dir === 'step_down') return false;
      // Count logged days since latest.from
      let count = 0;
      for (const d of DAYS) {
        if (d.date >= latest.from && d.date <= TODAY_DATE) {
          const rec = state.logs[`${action.id}::${d.date}`];
          if (rec && ['DONE', 'MISSED', 'QADAA_DONE', 'PERCENT'].includes(rec.status)) count++;
        }
      }
      return count < 5;
    }

    function isCellDisabled(action, dayIdx) {
      const dateStr = DAYS[dayIdx].date;
      const rec = state.logs[`${action.id}::${dateStr}`];
      if (rec && rec.status === 'DISABLED') return true;
      if (rec && rec.enabledOverride === true) return false;
      if (rec && rec.status && rec.status !== 'EMPTY') return false;
      return action.offDays.includes(dayIdx);
    }

    function isWindowExpired(action, dayIdx) {
      if (dayIdx < 5) return true; // Past days expired
      if (dayIdx > 5) return false; // Future days
      const pId = action.side === 'right' ? action.periodId : action.boundPeriodId;
      if (!pId) return false;
      const p = PERIODS.find(x => x.id === pId);
      return p ? p.state === 'expired' : false;
    }

    function getCellDisplayState(action, dayIdx) {
      const dateStr = DAYS[dayIdx].date;
      const rec = state.logs[`${action.id}::${dateStr}`];
      if (isCellDisabled(action, dayIdx)) return { status: 'DISABLED', pct: null, note: rec?.note || '' };
      if (!rec || !rec.status || rec.status === 'EMPTY') {
        return { status: isWindowExpired(action, dayIdx) ? 'UNLOGGED_EXPIRED' : 'PENDING', pct: null, note: rec?.note || '' };
      }
      return rec;
    }

    function getScore(rec) {
      if (!rec) return null;
      if (rec.status === 'DONE') return 1.0;
      if (rec.status === 'QADAA_DONE') return 0.85;
      if (rec.status === 'PERCENT') return (rec.pct || 0) / 100;
      if (rec.status === 'MISSED') return 0.0;
      return null;
    }

    function countOpenQadaa() {
      let n = state.historicalQadaa.filter(h => h.status === 'MISSED').length;
      for (const a of state.actions) {
        if (!a.qadaa) continue;
        for (let i = 0; i <= 5; i++) {
          const st = getCellDisplayState(a, i);
          if (st.status === 'MISSED') n++;
        }
      }
      return n;
    }

    function get48hUnlogged() {
      const list = [];
      for (const dayIdx of [4, 5]) { // Yesterday (Wed 18) + Today (Thu 19)
        for (const a of state.actions) {
          const st = getCellDisplayState(a, dayIdx);
          if (st.status === 'UNLOGGED_EXPIRED') {
            list.push({ action: a, dayIdx, date: DAYS[dayIdx].date });
          }
        }
      }
      return list;
    }

    // =========================================================================
    // Mutations + 5-Second Live Undo Engine + Offline Queue Counter
    // =========================================================================
    let undoTimer = null;
    let undoSnapshot = null;

    function mutateCell(actionId, dateStr, newRec, undoLabel = null) {
      const key = `${actionId}::${dateStr}`;
      const prev = state.logs[key] ? { ...state.logs[key] } : null;

      // Canonicalization rules (§2.2): 100% -> DONE, 0% -> MISSED
      if (newRec && newRec.status === 'PERCENT') {
        if (newRec.pct >= 100) newRec = { ...newRec, status: 'DONE', pct: null };
        else if (newRec.pct <= 0) newRec = { ...newRec, status: 'MISSED', pct: null };
      }

      if (!newRec) {
        delete state.logs[key];
      } else {
        const tv = newRec.targetVersionId || getActiveTarget(actionId, dateStr)?.id || null;
        state.logs[key] = { ...newRec, targetVersionId: tv };
      }

      if (state.syncMode !== 'synced') {
        state.pendingOutbox++;
      }

      if (undoLabel) {
        showUndo(undoLabel, () => {
          if (prev) state.logs[key] = prev;
          else delete state.logs[key];
          render();
        });
      }
      render();
    }

    function showUndo(message, revertFn) {
      clearTimeout(undoTimer);
      undoSnapshot = revertFn;
      const toast = document.getElementById('undo-toast');
      const msgEl = document.getElementById('undo-message');
      const bar = document.getElementById('undo-progress');
      msgEl.textContent = message;
      toast.classList.add('visible');
      bar.style.transition = 'none';
      bar.style.transform = 'scaleX(1)';
      requestAnimationFrame(() => {
        bar.style.transition = 'transform 5000ms linear';
        bar.style.transform = 'scaleX(0)';
      });
      undoTimer = setTimeout(() => {
        toast.classList.remove('visible');
        undoSnapshot = null;
      }, 5000);
    }

    document.getElementById('undo-action-btn').addEventListener('click', () => {
      clearTimeout(undoTimer);
      document.getElementById('undo-toast').classList.remove('visible');
      if (undoSnapshot) {
        const fn = undoSnapshot;
        undoSnapshot = null;
        fn();
      }
    });

    // =========================================================================
    // Render Shell Chrome (Nav, Sync, Theme)
    // =========================================================================
    const NAV_ITEMS = [
      { id: 'now', label: 'الآن', icon: 'now' },
      { id: 'matrix', label: 'الجدول', desktopLabel: 'الجدول الأسبوعي', icon: 'matrix' },
      { id: 'qadaa', label: 'القضاء', icon: 'qadaa', hasBadge: true },
      { id: 'analytics', label: 'التحليلات', icon: 'analytics' },
      { id: 'settings', label: 'الإعدادات', icon: 'settings' }
    ];

    function renderChrome() {
      const qCount = countOpenQadaa();
      const dNav = document.getElementById('desktop-nav');
      const mNav = document.getElementById('mobile-nav');
      const titleEl = document.getElementById('active-screen-title');

      const curNav = NAV_ITEMS.find(x => x.id === state.screen);
      titleEl.textContent = curNav.desktopLabel || curNav.label;

      dNav.innerHTML = NAV_ITEMS.map(item => `
        <button class="nav-btn" type="button" data-nav="${item.id}" aria-current="${state.screen === item.id ? 'page' : 'false'}">
          <span class="nav-btn-label">${ICONS[item.icon]}<span>${item.desktopLabel || item.label}</span></span>
          ${item.hasBadge && qCount > 0 ? `<span class="count-chip alert nums">${qCount}</span>` : ''}
        </button>
      `).join('');

      mNav.innerHTML = NAV_ITEMS.map(item => `
        <button class="mobile-nav-btn" type="button" data-nav="${item.id}" aria-current="${state.screen === item.id ? 'page' : 'false'}">
          ${ICONS[item.icon]}
          <span>${item.label}</span>
          ${item.hasBadge && qCount > 0 ? `<span class="mobile-badge nums">${qCount}</span>` : ''}
        </button>
      `).join('');

      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.screen = btn.dataset.nav;
          render();
        });
      });

      // Sync Badges
      const syncLabel = state.syncMode === 'synced'
        ? 'متزامن'
        : state.syncMode === 'offline'
          ? `أوفلاين (${state.pendingOutbox} بالانتظار)`
          : `يتطلب تأكيد الجلسة (${state.pendingOutbox})`;

      ['desktop-sync-btn', 'mobile-sync-btn'].forEach(id => {
        const el = document.getElementById(id);
        el.dataset.sync = state.syncMode;
        el.querySelector('.sync-label').textContent = syncLabel;
      });

      // Theme & Sidebar Collapse State
      document.documentElement.dataset.theme = state.theme;
      const shellEl = document.getElementById('app-shell');
      shellEl.classList.toggle('sidebar-collapsed', state.sidebarCollapsed);
      const isOverview = state.screen === 'matrix' && state.matrixOverviewMode;
      shellEl.classList.toggle('overview-active', isOverview);
      const mainEl = document.getElementById('app-main');
      mainEl.classList.toggle('overview-wide', isOverview);
      const iconHtml = state.theme === 'light' ? ICONS.moon : ICONS.sun;
      document.querySelectorAll('.theme-icon-slot').forEach(s => { s.innerHTML = iconHtml; });
      const dThemeTxt = document.querySelector('#desktop-theme-btn .theme-text');
      if (dThemeTxt) dThemeTxt.textContent = state.theme === 'light' ? 'الوضع الليلي (الفجر)' : 'الوضع النهاري (الشارع)';
    }

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      renderChrome();
    }

    function cycleSyncMode() {
      if (state.syncMode === 'synced') {
        state.syncMode = 'offline';
        state.pendingOutbox = Math.max(state.pendingOutbox, 2);
      } else if (state.syncMode === 'offline') {
        state.syncMode = 'attention';
      } else {
        state.syncMode = 'synced';
        state.pendingOutbox = 0;
      }
      render();
    }

    document.getElementById('desktop-theme-btn').addEventListener('click', toggleTheme);
    document.getElementById('mobile-theme-btn').addEventListener('click', toggleTheme);
    document.getElementById('desktop-sync-btn').addEventListener('click', cycleSyncMode);
    document.getElementById('mobile-sync-btn').addEventListener('click', cycleSyncMode);

    // Collapsible Desktop Right Panel + Layout-Independent Shortcut (Ctrl + KeyI => Ctrl+I / Ctrl+ه)
    function toggleSidebar() {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      renderChrome();
    }

    document.getElementById('btn-collapse-sidebar').innerHTML = ICONS.sidebarToggle;
    document.getElementById('btn-expand-sidebar').innerHTML = ICONS.sidebarToggle;
    document.getElementById('btn-collapse-sidebar').addEventListener('click', toggleSidebar);
    document.getElementById('btn-expand-sidebar').addEventListener('click', toggleSidebar);

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.code === 'KeyI') {
        e.preventDefault();
        toggleSidebar();
      }
    });

    // =========================================================================
    // Screen 1: <3s Street Quick-Log ("الآن")
    // =========================================================================
    function renderNowScreen() {
      const day = DAYS[state.selectedDayIdx];
      const period = PERIODS.find(p => p.id === state.selectedPeriodId) || PERIODS[3];
      const rightPeriods = PERIODS.filter(p => p.side === 'right');

      const periodActions = state.actions.filter(a => a.side === 'right' && a.periodId === period.id);
      const boundLeftActions = state.actions.filter(a => a.side === 'left' && a.boundPeriodId === period.id && !isCellDisabled(a, day.idx));
      const unlogged48 = get48hUnlogged();

      // Quick split eligibility checks (Non-overwriting!)
      const emptyMosque = periodActions.filter(a => a.isMosque && !a.pct && !isCellDisabled(a, day.idx) && ['PENDING', 'UNLOGGED_EXPIRED'].includes(getCellDisplayState(a, day.idx).status));
      const emptyAllRight = periodActions.filter(a => !isCellDisabled(a, day.idx) && ['PENDING', 'UNLOGGED_EXPIRED'].includes(getCellDisplayState(a, day.idx).status));

      const isClosing = period.state === 'live' && period.remainingMin <= 25;
      const timeStatusText = period.state === 'live'
        ? `باقي ${period.remainingMin} دقيقة`
        : period.state === 'expired'
          ? 'انتهى الوقت'
          : period.state === 'open'
            ? `متاح (${period.remainingMin} دقيقة)`
            : 'قادم';

      return `
        <!-- Joi-Style 7-Day Strip -->
        <section class="day-strip" aria-label="أيام الأسبوع">
          ${DAYS.map(d => `
            <button class="day-tile" type="button" data-day="${d.idx}" aria-pressed="${d.idx === day.idx}">
              <span class="day-tile-name">${d.short}</span>
              <span class="day-tile-num nums">${d.num}</span>
              ${d.isToday ? '<span class="day-tile-dot" title="اليوم"></span>' : '<span style="height:5px"></span>'}
            </button>
          `).join('')}
        </section>

        <!-- Conditional 48h Unlogged Catch-Up Banner -->
        ${unlogged48.length > 0 ? `
          <div class="catchup-bar">
            <span class="catchup-text">${ICONS.alert}<span>لديك <strong class="nums">${unlogged48.length}</strong> خانات منتهية غير مسجلة خلال آخر 48 ساعة</span></span>
            <button class="btn" type="button" id="go-catchup-btn">مراجعة سريعة</button>
          </div>
        ` : ''}

        <!-- Period Switcher -->
        <div class="period-strip" role="tablist" aria-label="فترات اليوم">
          ${rightPeriods.map(p => `
            <button class="period-pill" type="button" role="tab" data-period="${p.id}" aria-selected="${p.id === period.id}">
              ${p.state === 'live' ? '<span class="live-indicator"></span>' : ''}
              <span>${p.name}</span>
            </button>
          `).join('')}
        </div>

        <!-- Active Window Panel + Signature 2px Time-Window Horizon Rail -->
        <section class="panel" aria-label="أعمال الفترة">
          <div class="window-header">
            <h3 class="window-title">فترة ${period.name}</h3>
            <div class="window-time-meta nums">
              <span dir="ltr">${period.timeLabel}</span>
              <span class="window-countdown ${isClosing ? 'closing' : ''}">${timeStatusText}</span>
            </div>
            <div class="horizon-track" aria-hidden="true">
              <div class="horizon-fill ${isClosing ? 'closing' : ''}" style="width:${period.elapsedPct}%"></div>
            </div>
          </div>

          <!-- Split Quick-Actions (Mosque vs Full Period, Strictly Non-Overwriting) -->
          <div class="quick-split">
            <button class="btn btn-live" type="button" id="btn-mark-mosque" ${emptyMosque.length === 0 ? 'disabled' : ''}>
              ${ICONS.mosque}
              <span>تم ما في المسجد${emptyMosque.length > 0 ? ` (${emptyMosque.length})` : ''}</span>
            </button>
            <button class="btn" type="button" id="btn-mark-full" ${emptyAllRight.length === 0 ? 'disabled' : ''}>
              ${ICONS.checkAll}
              <span>تم الفترة بالكامل${emptyAllRight.length > 0 ? ` (${emptyAllRight.length})` : ''}</span>
            </button>
          </div>

          <!-- WHOOP-Style Action Rows -->
          <div class="action-list">
            ${periodActions.map(a => renderStreetActionRow(a, day)).join('')}
          </div>

          ${boundLeftActions.length > 0 ? `
            <div class="sub-band">
              <span>عادات يومية مرتبطة بهذه الفترة</span>
              <span>خارج زر المسجد وإحصاء الفترة</span>
            </div>
            <div class="action-list">
              ${boundLeftActions.map(a => renderStreetActionRow(a, day)).join('')}
            </div>
          ` : ''}
        </section>
      `;
    }

    function renderStreetActionRow(action, day) {
      const st = getCellDisplayState(action, day.idx);
      const isDisabled = st.status === 'DISABLED';
      const activeTarget = getActiveTarget(action.id, day.date);
      const showGrace = isNewTargetGrace(action);

      // 7-day WHOOP mini dots
      const dotsHtml = DAYS.map(d => {
        const s = getCellDisplayState(action, d.idx).status;
        const cls = s === 'DONE' ? 'done'
          : s === 'MISSED' ? 'missed'
          : s === 'QADAA_DONE' ? 'qadaa'
          : s === 'PERCENT' ? 'percent'
          : s === 'DISABLED' ? 'disabled'
          : s === 'UNLOGGED_EXPIRED' ? 'expired' : '';
        return `<span class="w-dot ${cls}" title="${d.short}"></span>`;
      }).join('');

      const pctChipsHtml = action.pct && !isDisabled ? `
        <div class="pct-bar" role="group" aria-label="تحديد النسبة المئوية">
          ${[25, 50, 75, 100, 0].map(val => {
            const isSel = (val === 100 && st.status === 'DONE')
              || (val === 0 && st.status === 'MISSED')
              || (st.status === 'PERCENT' && st.pct === val);
            const cls = isSel ? (val === 100 ? 'selected-done' : val === 0 ? 'selected-missed' : 'selected-pct') : '';
            return `
              <button class="pct-chip nums ${cls}" type="button" data-pct-action="${action.id}" data-pct-val="${val}">
                ${val}%
                ${val > 0 && val < 100 && isSel ? `<span class="pct-chip-fill" style="width:${val}%"></span>` : ''}
              </button>
            `;
          }).join('')}
        </div>
      ` : '';

      return `
        <div class="action-row ${isDisabled ? 'is-disabled' : ''}">
          <div class="action-row-main">
            <div class="action-info">
              <div class="action-title-line">
                <span class="action-title">${action.title}</span>
                ${activeTarget ? `<span class="target-tag nums">${activeTarget.label}</span>` : ''}
                ${showGrace ? `<span class="target-tag new-target-tag">هدف جديد</span>` : ''}
                ${isDisabled ? `<span class="target-tag">معذور اليوم</span>` : ''}
              </div>
              <div class="action-sub-line">
                <span class="week-dots" aria-label="حالة آخر 7 أيام">${dotsHtml}</span>
                ${st.note ? `<span class="row-note-preview">${st.note}</span>` : ''}
              </div>
            </div>
            <div class="action-controls">
              <button class="tap-btn ${st.status === 'DONE' ? 'active-done' : (st.status === 'QADAA_DONE' ? 'active-qadaa' : '')}"
                type="button" data-tap-done="${action.id}" aria-label="تسجيل تم للعمل ${action.title}">
                ${st.status === 'QADAA_DONE' ? ICONS.qadaaSm : ICONS.check}
              </button>
              <button class="tap-btn ${st.status === 'MISSED' ? 'active-missed' : ''}"
                type="button" data-tap-missed="${action.id}" aria-label="تسجيل فات للعمل ${action.title}">
                ${ICONS.cross}
              </button>
              <button class="tap-btn tap-btn-more" type="button" data-open-cell="${action.id}::${day.idx}" aria-label="خيارات إضافية">
                ${ICONS.more}
              </button>
            </div>
          </div>
          ${pctChipsHtml}
        </div>
      `;
    }

    function wireNowEvents() {
      const day = DAYS[state.selectedDayIdx];
      document.querySelectorAll('[data-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedDayIdx = Number(btn.dataset.day);
          render();
        });
      });

      document.querySelectorAll('[data-period]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedPeriodId = btn.dataset.period;
          render();
        });
      });

      const catchBtn = document.getElementById('go-catchup-btn');
      if (catchBtn) {
        catchBtn.addEventListener('click', () => {
          state.screen = 'qadaa';
          state.qadaaTab = 'unlogged';
          render();
        });
      }

      // Split Quick-Actions with 5s Undo Snapshot
      const markMosqueBtn = document.getElementById('btn-mark-mosque');
      if (markMosqueBtn) {
        markMosqueBtn.addEventListener('click', () => {
          const targets = state.actions.filter(a =>
            a.side === 'right' && a.periodId === state.selectedPeriodId && a.isMosque && !a.pct
            && !isCellDisabled(a, day.idx)
            && ['PENDING', 'UNLOGGED_EXPIRED'].includes(getCellDisplayState(a, day.idx).status)
          );
          if (!targets.length) return;
          const prevMap = {};
          targets.forEach(a => {
            const k = `${a.id}::${day.date}`;
            prevMap[k] = state.logs[k] ? { ...state.logs[k] } : null;
            state.logs[k] = { status: 'DONE', pct: null, note: '', targetVersionId: getActiveTarget(a.id, day.date)?.id || null };
            if (state.syncMode !== 'synced') state.pendingOutbox++;
          });
          showUndo(`تم تسجيل ${targets.length} أعمال في المسجد`, () => {
            Object.entries(prevMap).forEach(([k, v]) => { if (v) state.logs[k] = v; else delete state.logs[k]; });
            render();
          });
          render();
        });
      }

      const markFullBtn = document.getElementById('btn-mark-full');
      if (markFullBtn) {
        markFullBtn.addEventListener('click', () => {
          const targets = state.actions.filter(a =>
            a.side === 'right' && a.periodId === state.selectedPeriodId
            && !isCellDisabled(a, day.idx)
            && ['PENDING', 'UNLOGGED_EXPIRED'].includes(getCellDisplayState(a, day.idx).status)
          );
          if (!targets.length) return;
          const prevMap = {};
          targets.forEach(a => {
            const k = `${a.id}::${day.date}`;
            prevMap[k] = state.logs[k] ? { ...state.logs[k] } : null;
            state.logs[k] = { status: 'DONE', pct: null, note: '', targetVersionId: getActiveTarget(a.id, day.date)?.id || null };
            if (state.syncMode !== 'synced') state.pendingOutbox++;
          });
          showUndo(`تم تسجيل الفترة بالكامل (${targets.length})`, () => {
            Object.entries(prevMap).forEach(([k, v]) => { if (v) state.logs[k] = v; else delete state.logs[k]; });
            render();
          });
          render();
        });
      }

      // 1-Tap Done / Missed
      document.querySelectorAll('[data-tap-done]').forEach(btn => {
        btn.addEventListener('click', () => {
          const aid = btn.dataset.tapDone;
          const cur = getCellDisplayState(getAction(aid), day.idx);
          if (cur.status === 'DONE') {
            mutateCell(aid, day.date, null);
          } else {
            mutateCell(aid, day.date, { status: 'DONE', pct: null, note: cur.note || '', enabledOverride: true });
          }
        });
      });

      document.querySelectorAll('[data-tap-missed]').forEach(btn => {
        btn.addEventListener('click', () => {
          const aid = btn.dataset.tapMissed;
          const cur = getCellDisplayState(getAction(aid), day.idx);
          if (cur.status === 'MISSED') {
            mutateCell(aid, day.date, null);
          } else {
            mutateCell(aid, day.date, { status: 'MISSED', pct: null, note: cur.note || '', enabledOverride: true });
          }
        });
      });

      // Inline Percentage Chips
      document.querySelectorAll('[data-pct-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const aid = btn.dataset.pctAction;
          const val = Number(btn.dataset.pctVal);
          const cur = getCellDisplayState(getAction(aid), day.idx);
          mutateCell(aid, day.date, { status: 'PERCENT', pct: val, note: cur.note || '', enabledOverride: true });
        });
      });

      wireCellOpenButtons();
    }

    // =========================================================================
    // Screen 2: Weekly Matrix (Syncra Desktop Table + WHOOP Mobile Ledger)
    // =========================================================================
    function renderCellContent(st) {
      if (st.status === 'DONE') return { cls: 'st-done', html: ICONS.checkSm };
      if (st.status === 'MISSED') return { cls: 'st-missed', html: ICONS.crossSm };
      if (st.status === 'QADAA_DONE') return { cls: 'st-qadaa', html: ICONS.qadaaSm };
      if (st.status === 'PERCENT') {
        return {
          cls: 'st-percent nums',
          html: `${st.pct}%<span class="m-cell-bar" style="width:${st.pct}%"></span>`
        };
      }
      if (st.status === 'DISABLED') return { cls: 'st-disabled', html: ICONS.dashSm };
      if (st.status === 'UNLOGGED_EXPIRED') return { cls: 'st-expired', html: '' };
      return { cls: 'st-pending', html: '' };
    }

    function computeActionWeekRate(action) {
      let sum = 0; let count = 0;
      for (let i = 0; i <= 5; i++) {
        const s = getScore(getCellDisplayState(action, i));
        if (s !== null) { sum += s; count++; }
      }
      return count > 0 ? `${Math.round((sum / count) * 100)}%` : '—';
    }

    function renderMatrixTable(compact = false, sideFilter = 'both') {
      const rightGroups = PERIODS.filter(p => p.side === 'right');
      const leftGroups = PERIODS.filter(p => p.side === 'left');

      const renderGroupBlock = (p) => {
        const acts = state.actions.filter(a => a.periodId === p.id);
        const collapsed = sideFilter === 'both' ? !!state.collapsedGroups[p.id] : false;
        const liveRail = p.state === 'live'
          ? `<span class="horizon-track"><span class="horizon-fill ${p.remainingMin <= 25 ? 'closing' : ''}" style="width:${p.elapsedPct}%"></span></span>`
          : '';
        return `
          <tr class="group-row">
            <td colspan="9">
              <button class="group-toggle" type="button" data-toggle-group="${p.id}" aria-expanded="${!collapsed}">
                <span class="group-toggle-start">
                  ${collapsed ? ICONS.chevronLeft : ICONS.chevronDown}
                  <span>${p.name}</span>
                  <span class="panel-meta nums">(${acts.length})</span>
                </span>
                ${p.timeLabel && !compact ? `<span class="panel-meta nums" dir="ltr">${p.timeLabel}</span>` : ''}
                ${liveRail}
              </button>
            </td>
          </tr>
          ${collapsed ? '' : acts.map(a => {
            const tv = getActiveTarget(a.id, TODAY_DATE);
            return `
              <tr class="data-row">
                <td class="cell-title" title="${a.title}">
                  ${a.title}
                  ${tv && !compact ? ` <span class="target-tag nums">${tv.label}</span>` : ''}
                </td>
                ${DAYS.map(d => {
                  const st = getCellDisplayState(a, d.idx);
                  const c = renderCellContent(st);
                  return `
                    <td class="cell-status">
                      <button class="m-cell ${c.cls}" type="button" data-open-cell="${a.id}::${d.idx}"
                        aria-label="${a.title} ${d.short}">
                        ${c.html}
                      </button>
                    </td>
                  `;
                }).join('')}
                <td class="cell-rate nums">${computeActionWeekRate(a)}</td>
              </tr>
            `;
          }).join('')}
        `;
      };

      const bodyRows = sideFilter === 'right'
        ? `<tr class="side-label-row"><td colspan="9">الفترات الزمنية الموقوتة (الجدول الأيمن)</td></tr>${rightGroups.map(renderGroupBlock).join('')}`
        : sideFilter === 'left'
          ? `<tr class="side-label-row"><td colspan="9">العادات والسنن اليومية (الجدول الأيسر)</td></tr>${leftGroups.map(renderGroupBlock).join('')}`
          : `<tr class="side-label-row"><td colspan="9">الفترات الزمنية الموقوتة (الجدول الأيمن)</td></tr>
             ${rightGroups.map(renderGroupBlock).join('')}
             <tr class="side-divider"><td colspan="9"></td></tr>
             <tr class="side-label-row"><td colspan="9">العادات والسنن اليومية (الجدول الأيسر)</td></tr>
             ${leftGroups.map(renderGroupBlock).join('')}`;

      return `
        <div class="ledger-table-wrap">
          <table class="ledger-table">
            <thead>
              <tr>
                <th class="col-action">العمل</th>
                ${DAYS.map(d => `<th class="col-day ${d.isToday ? 'is-today' : ''}"><span dir="ltr">${compact ? d.abbr : d.short}</span><div class="nums">${d.num}</div></th>`).join('')}
                <th class="col-rate">${compact ? '%' : 'النسبة'}</th>
              </tr>
            </thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>
      `;
    }

    function renderMobileWhoopLedger() {
      return PERIODS.map(p => {
        const acts = state.actions.filter(a => a.periodId === p.id);
        const collapsed = !!state.collapsedGroups[p.id];
        return `
          <section class="panel">
            <button class="group-toggle" type="button" data-toggle-group="${p.id}" style="background:var(--bg-subtle);border-block-end:${collapsed ? 'none' : '1px solid var(--border-hairline)'}">
              <span class="group-toggle-start">
                ${collapsed ? ICONS.chevronLeft : ICONS.chevronDown}
                <span>${p.name}</span>
              </span>
              <span class="panel-meta nums">${acts.length} أعمال</span>
            </button>
            ${collapsed ? '' : acts.map(a => `
              <div class="m-whoop-row">
                <div class="m-whoop-head">
                  <span style="font-size:0.875rem;font-weight:500">${a.title}</span>
                  <span class="panel-meta nums">${computeActionWeekRate(a)}</span>
                </div>
                <div class="m-whoop-days">
                  ${DAYS.map(d => {
                    const st = getCellDisplayState(a, d.idx);
                    const c = renderCellContent(st);
                    return `
                      <button class="m-whoop-day" type="button" data-open-cell="${a.id}::${d.idx}" aria-label="${a.title} ${d.abbr}">
                        <span class="m-whoop-day-lbl" dir="ltr">${d.abbr}</span>
                        <span class="m-whoop-circle ${c.cls}">${c.html}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </section>
        `;
      }).join('');
    }

    function renderOverviewSideTable(side) {
      const groups = PERIODS.filter(p => p.side === side);
      const rows = groups.map(p => {
        const acts = state.actions.filter(a => a.periodId === p.id);
        return acts.map((a, idx) => {
          const isLastInGroup = idx === acts.length - 1;
          return `
            <tr class="data-row ${isLastInGroup ? 'period-end-row' : ''}">
              ${idx === 0 ? `<td class="cell-period ${p.state === 'live' ? 'is-live-period' : ''}" rowspan="${acts.length}">${p.name}</td>` : ''}
              <td class="cell-title" title="${a.title}">${a.title}</td>
              ${DAYS.map(d => {
                const st = getCellDisplayState(a, d.idx);
                const c = renderCellContent(st);
                return `
                  <td class="cell-status">
                    <button class="m-cell ${c.cls}" type="button" data-open-cell="${a.id}::${d.idx}" aria-label="${a.title} ${d.abbr}">${c.html}</button>
                  </td>
                `;
              }).join('')}
              <td class="cell-rate nums">${computeActionWeekRate(a)}</td>
            </tr>
          `;
        }).join('');
      }).join('');

      return `
        <div class="ledger-table-wrap">
          <table class="ledger-table">
            <thead>
              <tr>
                <th class="col-period">${side === 'right' ? 'الفترة' : 'المجموعة'}</th>
                <th class="col-action">العمل</th>
                ${DAYS.map(d => `<th class="col-day ${d.isToday ? 'is-today' : ''}"><span dir="ltr">${d.abbr}</span> <span class="nums">${d.num}</span></th>`).join('')}
                <th class="col-rate">%</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderMatrixScreen() {
      const expiredCount = get48hUnlogged().length;
      return `
        <div class="matrix-toolbar">
          <div class="matrix-toolbar-group">
            <strong style="font-size:0.9375rem">أسبوع 14 نوفمبر إلى 20 نوفمبر</strong>
            <div class="seg-tabs desktop-only" role="tablist" aria-label="وضع عرض الجدول">
              <button class="seg-tab" type="button" role="tab" data-dview="standard" aria-selected="${!state.matrixOverviewMode}">العرض المريح</button>
              <button class="seg-tab" type="button" role="tab" data-dview="overview" aria-selected="${state.matrixOverviewMode}">نظرة واحدة (بدون سكرول)</button>
            </div>
          </div>
          <div class="matrix-toolbar-group">
            <button class="btn" type="button" id="btn-normal-day">يوم اعتيادي</button>
            <button class="btn" type="button" id="btn-archive-qadaa" ${expiredCount === 0 ? 'disabled' : ''}>
              ترحيل المنتهي للقضاء (${expiredCount})
            </button>
          </div>
        </div>

        <!-- Desktop Matrix: Standard Single-Column OR Side-by-Side Zero-Scroll Sheet Mode -->
        <div class="matrix-desktop-wrap">
          ${state.matrixOverviewMode
            ? `<div class="overview-split">${renderOverviewSideTable('right')}${renderOverviewSideTable('left')}</div>`
            : renderMatrixTable(false, 'both')}
        </div>

        <!-- Mobile Parity: WHOOP 7-Day Circle Ledger + Compact Toggle -->
        <div class="matrix-mobile-wrap ${state.mobileMatrixGrid ? 'force-grid' : ''}">
          <div class="seg-tabs">
            <button class="seg-tab" type="button" data-mview="whoop" aria-selected="${!state.mobileMatrixGrid}">دوائر الأسبوع (مريح للموبايل)</button>
            <button class="seg-tab" type="button" data-mview="grid" aria-selected="${state.mobileMatrixGrid}">جدول مضغوط</button>
          </div>
          <div class="mobile-ledger-view" style="display:flex;flex-direction:column;gap:12px">
            ${renderMobileWhoopLedger()}
          </div>
          <div class="mobile-compact-table">
            ${renderMatrixTable(true)}
          </div>
        </div>
      `;
    }

    function wireMatrixEvents() {
      document.querySelectorAll('[data-toggle-group]').forEach(btn => {
        btn.addEventListener('click', () => {
          const gid = btn.dataset.toggleGroup;
          state.collapsedGroups[gid] = !state.collapsedGroups[gid];
          render();
        });
      });

      document.querySelectorAll('[data-mview]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.mobileMatrixGrid = btn.dataset.mview === 'grid';
          render();
        });
      });

      document.querySelectorAll('[data-dview]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.matrixOverviewMode = btn.dataset.dview === 'overview';
          if (state.matrixOverviewMode) state.sidebarCollapsed = true;
          render();
        });
      });

      // Archive expired EMPTY to MISSED (Stage 2 Rule)
      const archBtn = document.getElementById('btn-archive-qadaa');
      if (archBtn) {
        archBtn.addEventListener('click', () => {
          const items = get48hUnlogged();
          if (!items.length) return;
          const prevMap = {};
          items.forEach(({ action, date }) => {
            const k = `${action.id}::${date}`;
            prevMap[k] = state.logs[k] ? { ...state.logs[k] } : null;
            state.logs[k] = { status: 'MISSED', pct: null, note: '', targetVersionId: getActiveTarget(action.id, date)?.id || null };
            if (state.syncMode !== 'synced') state.pendingOutbox++;
          });
          showUndo(`تم ترحيل ${items.length} خانات منتهية إلى فوات وقضاء`, () => {
            Object.entries(prevMap).forEach(([k, v]) => { if (v) state.logs[k] = v; else delete state.logs[k]; });
            render();
          });
          render();
        });
      }

      // Normal Day Dialog Preview
      const normBtn = document.getElementById('btn-normal-day');
      if (normBtn) {
        normBtn.addEventListener('click', openNormalDayDialog);
      }

      wireCellOpenButtons();
    }

    // =========================================================================
    // Screen 3: Global Qadaa & 48h Backlog ("القضاء")
    // =========================================================================
    function renderQadaaScreen() {
      // Collect all open Qadaa (historical + this week)
      const openQadaa = [];
      state.historicalQadaa.forEach(h => {
        if (h.status === 'MISSED') {
          const a = getAction(h.actionId);
          openQadaa.push({ isHistorical: true, id: h.id, action: a, dayLabel: h.dayLabel, targetLabel: h.targetLabel, ageDays: h.ageDays });
        }
      });
      for (let i = 0; i <= 5; i++) {
        const d = DAYS[i];
        state.actions.forEach(a => {
          if (!a.qadaa) return;
          const st = getCellDisplayState(a, i);
          if (st.status === 'MISSED') {
            const snap = getTargetById(a.id, st.targetVersionId) || getActiveTarget(a.id, d.date);
            openQadaa.push({
              isHistorical: false,
              action: a,
              date: d.date,
              dayLabel: `${d.short} ${d.num} نوفمبر`,
              targetLabel: snap ? snap.label : null,
              ageDays: 5 - i
            });
          }
        });
      }

      const unlogged = get48hUnlogged();

      // Core non-recoverable misses this week
      const coreMisses = [];
      for (let i = 0; i <= 5; i++) {
        const d = DAYS[i];
        state.actions.forEach(a => {
          if (a.qadaa) return;
          const st = getCellDisplayState(a, i);
          if (st.status === 'MISSED') {
            coreMisses.push({ action: a, dayLabel: `${d.short} ${d.num} نوفمبر` });
          }
        });
      }

      let bodyHtml = '';
      if (state.qadaaTab === 'open') {
        bodyHtml = openQadaa.length === 0
          ? `<div class="empty-state">${ICONS.check}<span>لا توجد فوائت قضاء مفتوحة حالياً</span></div>`
          : openQadaa.map(item => `
              <div class="qadaa-row">
                <div class="qadaa-info">
                  <strong style="font-size:0.9375rem">${item.action.title}</strong>
                  <div class="qadaa-meta">
                    <span>${item.dayLabel}</span>
                    ${item.targetLabel ? `<span class="qadaa-snapshot nums">هدف ذلك اليوم: ${item.targetLabel}</span>` : ''}
                    <span class="nums">منذ ${item.ageDays === 0 ? 'اليوم' : item.ageDays + ' أيام'}</span>
                  </div>
                </div>
                <button class="btn btn-live" type="button"
                  data-resolve-qadaa="${item.isHistorical ? 'H::' + item.id : item.action.id + '::' + item.date}">
                  ${ICONS.qadaaSm}
                  <span>تم القضاء</span>
                </button>
              </div>
            `).join('');
      } else if (state.qadaaTab === 'unlogged') {
        bodyHtml = unlogged.length === 0
          ? `<div class="empty-state">${ICONS.check}<span>كل الخانات المنتهية خلال آخر 48 ساعة مسجلة</span></div>`
          : unlogged.map(item => `
              <div class="qadaa-row">
                <div class="qadaa-info">
                  <strong style="font-size:0.9375rem">${item.action.title}</strong>
                  <div class="qadaa-meta">
                    <span>${DAYS[item.dayIdx].short} ${DAYS[item.dayIdx].num} نوفمبر</span>
                    <span>غير مسجل بعد خروج الوقت</span>
                  </div>
                </div>
                <div class="action-controls">
                  <button class="btn" type="button" data-quick-resolve="${item.action.id}::${item.date}::DONE">${ICONS.checkSm}<span>تم</span></button>
                  <button class="btn" type="button" data-quick-resolve="${item.action.id}::${item.date}::MISSED">${ICONS.crossSm}<span>فات</span></button>
                  <button class="btn" type="button" data-quick-resolve="${item.action.id}::${item.date}::DISABLED">معذور</button>
                </div>
              </div>
            `).join('');
      } else {
        bodyHtml = coreMisses.length === 0
          ? `<div class="empty-state">${ICONS.check}<span>لا توجد فوات غير قابلة للقضاء هذا الأسبوع</span></div>`

                <div class="qadaa-info">
                  <strong style="font-size:0.9375rem">${item.action.title}</strong>
                  <div class="qadaa-meta"><span>${item.dayLabel}</span><span>لا يُقضى (للمتابعة والانتباه فقط)</span></div>
                </div>
                <span class="count-chip alert">فات</span>
              </div>
            `).join('');
      }

      return `
        <div class="seg-tabs" role="tablist">
          <button class="seg-tab" type="button" role="tab" data-qtab="open" aria-selected="${state.qadaaTab === 'open'}">
            <span>عليّ قضاؤه</span>
            <span class="count-chip ${openQadaa.length ? 'alert' : ''} nums">${openQadaa.length}</span>
          </button>
          <button class="seg-tab" type="button" role="tab" data-qtab="unlogged" aria-selected="${state.qadaaTab === 'unlogged'}">
            <span>غير مسجل (48 ساعة)</span>
            <span class="count-chip nums">${unlogged.length}</span>
          </button>
          <button class="seg-tab" type="button" role="tab" data-qtab="core" aria-selected="${state.qadaaTab === 'core'}">

        <section class="panel">
          <div class="panel-header">
            <h3 class="panel-title">
              ${state.qadaaTab === 'open' ? 'قائمة القضاء المفتوحة عبر الأسابيع' : state.qadaaTab === 'unlogged' ? 'استدراك الخانات غير المسجلة' : 'فوات الأعمال غير القابلة للقضاء'}
            </h3>
            <span class="panel-meta">القضاء يراعي هدف اليوم الأصلي دائماً</span>
          </div>
          <div>${bodyHtml}</div>

      `;

    function wireQadaaEvents() {
      document.querySelectorAll('[data-qtab]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.qadaaTab = btn.dataset.qtab;
          render();
        });
      });

      document.querySelectorAll('[data-resolve-qadaa]').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.resolveQadaa;
          if (val.startsWith('H::')) {
            const hid = val.slice(3);
            const rec = state.historicalQadaa.find(x => x.id === hid);
            if (!rec) return;
            rec.status = 'QADAA_DONE';
            if (state.syncMode !== 'synced') state.pendingOutbox++;
            showUndo(`تم قضاء ${getAction(rec.actionId).title} (${rec.targetLabel})`, () => {
              rec.status = 'MISSED';
              render();
            });
            render();
          } else {
            const [aid, date] = val.split('::');
            const prev = state.logs[val] ? { ...state.logs[val] } : null;
            mutateCell(aid, date, { ...prev, status: 'QADAA_DONE', pct: null }, `تم قضاء ${getAction(aid).title}`);
          }
        });
      });

      document.querySelectorAll('[data-quick-resolve]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [aid, date, status] = btn.dataset.quickResolve.split('::');
          mutateCell(aid, date, { status, pct: null, note: '', enabledOverride: status !== 'DISABLED' }, `تم تسجيل ${getAction(aid).title}`);
        });
      });
    }

    // =========================================================================
    // Screen 4: Analytics & Weakness Insights (3 Lean MVP Modules Only)
    // =========================================================================
    function renderAnalyticsScreen() {
      // Compute per-action scores over Sat..Thu
      const actionStats = state.actions.map(a => {
        let sum = 0; let logged = 0; let missed = 0;
        for (let i = 0; i <= 5; i++) {
          const st = getCellDisplayState(a, i);
          const sc = getScore(st);
          if (sc !== null) { sum += sc; logged++; }
          if (st.status === 'MISSED') missed++;
        }
        const rate = logged > 0 ? Math.round((sum / logged) * 100) : null;
        return { action: a, rate, logged, missed, grace: isNewTargetGrace(a) };
      });

      const weakSpots = actionStats
        .filter(x => x.logged >= 3 && x.rate < 85 && !x.grace)
        .sort((a, b) => a.rate - b.rate || b.missed - a.missed)
        .slice(0, 5);

      const weakIds = new Set(weakSpots.map(w => w.action.id));
      const graceOnlyItems = actionStats.filter(x => (x.grace || x.action.targets.length >= 2) && !weakIds.has(x.action.id));

      // Module 2: Strictly Isolated Right Time-Bound Windows vs Left Daily Groups
      const rightWindows = PERIODS.filter(p => p.side === 'right').map(p => {
        const acts = state.actions.filter(a => a.side === 'right' && a.periodId === p.id);
        let sum = 0, logged = 0, jSum = 0, jCount = 0, sSum = 0, sCount = 0;
        acts.forEach(a => {
          for (let i = 0; i <= 5; i++) {
            const sc = getScore(getCellDisplayState(a, i));
            if (sc !== null) {
              sum += sc; logged++;
              if (a.title.includes('الجماعة')) { jSum += sc; jCount++; }
              else { sSum += sc; sCount++; }
            }
          }
        });
        return {
          name: p.name,
          rate: logged ? Math.round((sum / logged) * 100) : 0,
          jamaahRate: jCount ? Math.round((jSum / jCount) * 100) : null,
          sunanRate: sCount ? Math.round((sSum / sCount) * 100) : null
        };
      });

      const leftGroups = PERIODS.filter(p => p.side === 'left').map(p => {
        const acts = state.actions.filter(a => a.side === 'left' && a.periodId === p.id);
        let sum = 0, logged = 0;
        acts.forEach(a => {
          for (let i = 0; i <= 5; i++) {
            const sc = getScore(getCellDisplayState(a, i));
            if (sc !== null) { sum += sc; logged++; }
          }
        });
        return { name: p.name, rate: logged ? Math.round((sum / logged) * 100) : null, logged };
      });

      // Module 3: Qadaa & Backlog Pulse
      const openQ = countOpenQadaa();
      let clearedThisWeek = state.historicalQadaa.filter(h => h.status === 'QADAA_DONE').length;
      let coreMisses = 0;
      let totalExpiredActive = 0;
      let loggedExpired = 0;
      for (let i = 0; i <= 5; i++) {
        state.actions.forEach(a => {
          const st = getCellDisplayState(a, i);
          if (st.status === 'QADAA_DONE') clearedThisWeek++;
          if (st.status === 'MISSED' && !a.qadaa) coreMisses++;
          if (st.status !== 'DISABLED' && isWindowExpired(a, i)) {
            totalExpiredActive++;
            if (st.status !== 'UNLOGGED_EXPIRED') loggedExpired++;
          }
        });
      }
      const coveragePct = totalExpiredActive ? Math.round((loggedExpired / totalExpiredActive) * 100) : 100;
      const unloggedCount = totalExpiredActive - loggedExpired;

      return `
        <!-- Module 3: Qadaa & Backlog Pulse -->
        <section class="panel">
          <div class="panel-header">
            <h3 class="panel-title">نبض القضاء والتراكم (آخر 7 أيام)</h3>
            <span class="panel-meta">الأرقام تفصل بين القضاء الفعلي ونسيان التسجيل</span>
          </div>
          <div class="pulse-grid">
            <div class="pulse-cell">
              <span class="pulse-label">ديون القضاء المفتوحة</span>
              <span class="pulse-num nums">${openQ}</span>
              <span class="pulse-detail nums">تم قضاء ${clearedThisWeek} هذا الأسبوع</span>
            </div>
            <div class="pulse-cell">
              <span class="pulse-label">تغطية التسجيل (ضد المراكمة)</span>
              <span class="pulse-num nums">${coveragePct}%</span>
              <span class="pulse-detail nums">${unloggedCount} خانات منتهية غير مسجلة</span>
            </div>
            <div class="pulse-cell">
              <span class="pulse-label">فوات لا تُقضى (للمتابعة)</span>
              <span class="pulse-num nums">${coreMisses}</span>
              <span class="pulse-detail">الجماعة الأولى والغفوة وملئ الجدول</span>
            </div>
          </div>
        </section>

        <!-- Module 1: Top Weakest Spots + Target Evolution Trail -->
        <section class="panel">
          <div class="panel-header">
            <h3 class="panel-title">أضعف الأعمال حالياً (أقل من 85%)</h3>
            <span class="panel-meta">الأهداف المطورة حديثاً معفاة من الإنذار لأول 5 تسجيلات</span>
          </div>
          <div>
            ${weakSpots.length === 0
              ? '<div class="empty-state">كل الأعمال المستقرة فوق 85% حالياً</div>'
              : weakSpots.map(w => {
                const hasTrail = w.action.targets.length >= 2;
                const first = hasTrail ? w.action.targets[0] : null;
                const last = hasTrail ? w.action.targets[w.action.targets.length - 1] : null;
                return `
                  <div class="bar-row">
                    <div class="bar-row-top">
                      <span style="font-weight:500">${w.action.title}</span>
                      <span class="nums" style="font-weight:700;color:var(--missed-ink)">${w.rate}%</span>
                    </div>
                    <div class="bar-track"><div class="bar-fill ${w.rate < 65 ? 'weak' : 'mid'}" style="width:${w.rate}%"></div></div>
                    ${hasTrail ? `<span class="progression-trail nums">${ICONS.trendUp}<span>تطوّر الهدف: ${first.label} ← ${last.label} (منذ ${last.from})</span></span>` : ''}
                  </div>
                `;
              }).join('')}

            ${graceOnlyItems.map(g => {
              const first = g.action.targets[0];
              const last = g.action.targets[g.action.targets.length - 1];
              return `
                <div class="bar-row" style="background:var(--bg-canvas)">
                  <div class="bar-row-top">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                      <span style="font-weight:600">${g.action.title}</span>
                      ${g.grace ? '<span class="target-tag new-target-tag">هدف جديد (فترة تأقلم)</span>' : ''}
                    </div>
                    <span class="nums" style="font-weight:600">${g.rate ?? 0}%</span>
                  </div>
                  <span class="progression-trail nums">
                    ${ICONS.trendUp}
                    <span>تطوّر الهدف: ${first.label} ← ${last.label} (منذ ${last.from})</span>
                  </span>
                </div>
              `;
            }).join('')}
          </div>
        </section>

        <!-- Module 2: Strictly Isolated Time-Bound Windows vs Left Daily Groups -->
        <div class="analytics-split">
          <section class="panel">
            <div class="panel-header">
              <h3 class="panel-title">الفترات الزمنية الموقوتة</h3>
              <div class="seg-tabs">
                <button class="seg-tab" type="button" data-horizon="7d" aria-selected="${state.analyticsHorizon === '7d'}">7 أيام</button>
                <button class="seg-tab" type="button" data-horizon="30d" aria-selected="${state.analyticsHorizon === '30d'}">30 يوم</button>
              </div>
            </div>
            <div>
              ${rightWindows.map(w => `
                <div class="bar-row">
                  <div class="bar-row-top">
                    <span style="font-weight:500">${w.name}</span>
                    <span class="nums" style="font-weight:600">${w.rate}%</span>
                  </div>
                  <div class="bar-track"><div class="bar-fill ${w.rate >= 85 ? 'good' : (w.rate >= 65 ? 'mid' : 'weak')}" style="width:${w.rate}%"></div></div>
                  ${w.jamaahRate !== null ? `
                    <div class="sub-split-note nums">
                      <span>الجماعة الأولى: <strong>${w.jamaahRate}%</strong></span>
                      <span>السنن والأذكار: <strong>${w.sunanRate}%</strong></span>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3 class="panel-title">مجموعات العادات اليومية (معزولة عن العشاء)</h3>
            </div>
            <div>
              ${leftGroups.map(g => `
                <div class="bar-row">
                  <div class="bar-row-top">
                    <span style="font-weight:500">${g.name}</span>
                    <span class="nums" style="font-weight:600">${g.rate !== null ? g.rate + '%' : 'لا توجد بيانات بعد'}</span>
                  </div>
                  <div class="bar-track"><div class="bar-fill ${g.rate >= 85 ? 'good' : 'mid'}" style="width:${g.rate || 0}%"></div></div>
                </div>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function wireAnalyticsEvents() {
      document.querySelectorAll('[data-horizon]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.analyticsHorizon = btn.dataset.horizon;
          render();
        });
      });

    // =========================================================================
    // Screen 5: Settings, Target Evolution & Customizable ntfy (Online-Only CRUD)
    // =========================================================================

      const rightPeriods = PERIODS.filter(p => p.side === 'right');
      const targetableActions = state.actions.filter(a => a.targets.length > 0 || ['quran_wird', 'morning_duha', 'isha_witr', 'maghrib_duaa', 'morning_istighfar'].includes(a.id));

      return `
        ${offline ? `
          <div class="offline-guard">

                  return `

                        <span class="panel-meta nums">
                          ${a.targets.length ? a.targets.map(t => t.label).join(' ← ') : 'بدون هدف رقمي محدد'}
                        </span>
                      </div>
                      <button class="btn" type="button" data-evolve-action="${a.id}" ${offline ? 'disabled' : ''}>
                        ${ICONS.trendUp}
                        <span>تطوير الهدف</span>
                      </button>
                    </div>
                  `;

              </div>
            </section>

            <section class="panel">

                  <strong style="font-size:0.875rem">بداية اليوم المحاسبي</strong>

                </div>
                <select class="field-select" id="rollover-select" ${offline ? 'disabled' : ''}>
                  <option value="FAJR" ${state.rolloverMode === 'FAJR' ? 'selected' : ''}>من الفجر للفجر (افتراضي)</option>
                  <option value="MIDNIGHT" ${state.rolloverMode === 'MIDNIGHT' ? 'selected' : ''}>منتصف الليل (00:00)</option>
                </select>
              </div>
              <div class="setting-row">
                <div>
                  <strong style="font-size:0.875rem">تصدير نسخة احتياطية (JSON)</strong>
                  <div class="panel-meta">يعمل حتى بدون إنترنت لحماية المسجّلات المحلية قبل المسح أو النقل</div>
                </div>
                <button class="btn" type="button" id="btn-export-json">

                    data-ntfy-lead="${p.id}" value="${p.ntfyLead}" ${(!state.ntfyMaster || !p.ntfyEnabled || offline) ? 'disabled' : ''} />

      const ro = document.getElementById('rollover-select');
      if (ro) ro.addEventListener('change', () => { state.rolloverMode = ro.value; });

      const nm = document.getElementById('ntfy-master');
      if (nm) nm.addEventListener('change', () => { state.ntfyMaster = nm.checked; render(); });

      document.querySelectorAll('[data-ntfy-period]').forEach(cb => {
        cb.addEventListener('change', () => {
          const p = PERIODS.find(x => x.id === cb.dataset.ntfyPeriod);
          if (p) { p.ntfyEnabled = cb.checked; render(); }
        });
      });

      document.querySelectorAll('[data-ntfy-lead]').forEach(inp => {
        inp.addEventListener('change', () => {
          const p = PERIODS.find(x => x.id === inp.dataset.ntfyLead);
          if (p) p.ntfyLead = Number(inp.value) || 25;
        });
      });

      const nd = document.getElementById('ntfy-digest');
      if (nd) nd.addEventListener('change', () => { state.ntfyDigest = nd.checked; render(); });

      const exp = document.getElementById('btn-export-json');
      if (exp) {
        exp.addEventListener('click', () => {
          const payload = JSON.stringify({ exportedAt: new Date().toISOString(), rolloverMode: state.rolloverMode, actions: state.actions, logs: state.logs }, null, 2);

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'mohasba-prototype-backup.json'; a.click();
          URL.revokeObjectURL(url);
        });
      }

      document.querySelectorAll('[data-evolve-action]').forEach(btn => {
        btn.addEventListener('click', () => openEvolveDialog(btn.dataset.evolveAction));
      });
    }

    const cellDialog = document.getElementById('cell-dialog');

    function wireCellOpenButtons() {

    function openCellDialog(actionId, dayIdx) {
      const action = getAction(actionId);
      const day = DAYS[dayIdx];
      const st = getCellDisplayState(action, dayIdx);
      const isOffDefault = action.offDays.includes(dayIdx);
      const tv = getTargetById(actionId, st.targetVersionId) || getActiveTarget(actionId, day.date);

      activeCellEdit = {
        actionId,
        dayIdx,
        date: day.date,
        status: ['PENDING', 'UNLOGGED_EXPIRED'].includes(st.status) ? 'EMPTY' : st.status,
        pct: st.pct || 50,
        note: st.note || ''
      };

      document.getElementById('cell-dialog-title').textContent = `${action.title} (${day.short} ${day.num} نوفمبر)`;
      const body = document.getElementById('cell-dialog-body');

      const renderDialogState = () => {
        body.innerHTML = `
          ${tv ? `<div class="panel-meta nums">الهدف الفعال لهذا اليوم: <strong>${tv.label}</strong></div>` : ''}
          <div class="state-grid">
            <button class="btn ${activeCellEdit.status === 'DONE' ? 'btn-live' : ''}" type="button" data-pick-st="DONE">${ICONS.checkSm}<span>تم</span></button>
            <button class="btn ${activeCellEdit.status === 'MISSED' ? 'btn-primary' : ''}" type="button" data-pick-st="MISSED">${ICONS.crossSm}<span>فات</span></button>
            ${action.qadaa ? `<button class="btn ${activeCellEdit.status === 'QADAA_DONE' ? 'btn-live' : ''}" type="button" data-pick-st="QADAA_DONE">${ICONS.qadaaSm}<span>تم القضاء</span></button>` : ''}
            <button class="btn ${activeCellEdit.status === 'DISABLED' ? 'btn-primary' : ''}" type="button" data-pick-st="DISABLED">${ICONS.dashSm}<span>معذور / تعطيل اليوم</span></button>
            <button class="btn ${activeCellEdit.status === 'EMPTY' ? 'btn-primary' : ''}" type="button" data-pick-st="EMPTY">
              ${isOffDefault ? 'تفعيل هذا اليوم (فارغ)' : 'مسح الحالة (فارغ)'}
            </button>
          </div>

          ${action.pct ? `
            <div style="display:flex;flex-direction:column;gap:6px;padding-top:4px">
              <div style="display:flex;justify-content:space-between">
                <span>تحديد نسبة مئوية (خطوات 10%)</span>
                <strong class="nums" id="dlg-pct-val">${activeCellEdit.status === 'PERCENT' ? activeCellEdit.pct + '%' : '—'}</strong>
              </div>
              <input type="range" min="0" max="100" step="10" value="${activeCellEdit.pct}" id="dlg-pct-range" style="accent-color:var(--accent-live)" />
            </div>
          ` : ''}

          <label style="display:flex;flex-direction:column;gap:4px">
            <span>ملاحظة اختيارية</span>
            <input class="field-input" type="text" id="dlg-note" value="${activeCellEdit.note.replace(/"/g, '&quot;')}" placeholder="مثال: سفر أو عذر أو تفاصيل الورد" />
          </label>
        `;

        body.querySelectorAll('[data-pick-st]').forEach(b => {
          b.addEventListener('click', () => {
            activeCellEdit.status = b.dataset.pickSt;
            renderDialogState();
          });
        });

        const rng = body.querySelector('#dlg-pct-range');
        if (rng) {
          rng.addEventListener('input', () => {
            activeCellEdit.status = 'PERCENT';
            activeCellEdit.pct = Number(rng.value);
            body.querySelector('#dlg-pct-val').textContent = `${activeCellEdit.pct}%`;
          });
        }

        const noteInp = body.querySelector('#dlg-note');
        if (noteInp) {
          noteInp.addEventListener('input', () => { activeCellEdit.note = noteInp.value; });
        }
      };

      renderDialogState();
      cellDialog.showModal();
    }

    document.getElementById('cell-dialog-close').innerHTML = ICONS.crossSm;
    document.getElementById('cell-dialog-close').addEventListener('click', () => cellDialog.close());
    document.getElementById('cell-dialog-cancel').addEventListener('click', () => cellDialog.close());
    document.getElementById('cell-dialog-save').addEventListener('click', () => {
      if (!activeCellEdit) return;
      const { actionId, date, status, pct, note } = activeCellEdit;
      if (status === 'EMPTY') {
        mutateCell(actionId, date, { status: 'EMPTY', pct: null, note, enabledOverride: true }, 'تم تحديث حالة الخلية');
      } else {
        mutateCell(actionId, date, { status, pct: status === 'PERCENT' ? pct : null, note, enabledOverride: status !== 'DISABLED' }, 'تم حفظ تعديل الخلية');
      }
      cellDialog.close();
    });

    // Normal Day Dialog
    const normalDialog = document.getElementById('normal-day-dialog');
    document.getElementById('normal-dialog-close').innerHTML = ICONS.crossSm;
    document.getElementById('normal-dialog-close').addEventListener('click', () => normalDialog.close());
    document.getElementById('normal-dialog-cancel').addEventListener('click', () => normalDialog.close());

    function openNormalDayDialog() {
      const day = DAYS[state.selectedDayIdx];
      const eligible = state.actions.filter(a =>
        a.normalDay && !isCellDisabled(a, day.idx) && ['PENDING', 'UNLOGGED_EXPIRED'].includes(getCellDisplayState(a, day.idx).status)
      );
      document.getElementById('normal-day-body').innerHTML = `
        <p style="margin:0">سيتم تعبئة <strong class="nums">${eligible.length}</strong> خانات فارغة فقط ليوم <strong>${day.short} ${day.num} نوفمبر</strong> بحالة «تم».</p>
        <p style="margin:0;color:var(--ink-secondary)">الأعمال الجوهرية (الجماعة الأولى، الاستيقاظ بدون غفوة، وملئ الجدول) مستثناة افتراضياً ولا تُعلّم تلقائياً أبداً.</p>
      `;
      document.getElementById('normal-dialog-apply').disabled = eligible.length === 0;
      document.getElementById('normal-dialog-apply').onclick = () => {
        const prevMap = {};
        eligible.forEach(a => {
          const k = `${a.id}::${day.date}`;
          prevMap[k] = state.logs[k] ? { ...state.logs[k] } : null;
          state.logs[k] = { status: 'DONE', pct: null, note: '', targetVersionId: getActiveTarget(a.id, day.date)?.id || null };
          if (state.syncMode !== 'synced') state.pendingOutbox++;
        });
        normalDialog.close();
        showUndo(`تم تطبيق يوم اعتيادي (${eligible.length} خانات)`, () => {
          Object.entries(prevMap).forEach(([k, v]) => { if (v) state.logs[k] = v; else delete state.logs[k]; });
          render();
        });
        render();
      };
      normalDialog.showModal();
    }

    // Target Evolution Dialog (Same-Day D vs Tomorrow D+1 Rule!)
    const evolveDialog = document.getElementById('evolve-dialog');
    document.getElementById('evolve-dialog-close').innerHTML = ICONS.crossSm;
    document.getElementById('evolve-dialog-close').addEventListener('click', () => evolveDialog.close());
    document.getElementById('evolve-dialog-cancel').addEventListener('click', () => evolveDialog.close());

    function openEvolveDialog(actionId) {
      const a = getAction(actionId);
      const todayRec = state.logs[`${actionId}::${TODAY_DATE}`];
      const todayLogged = !!(todayRec && ['DONE', 'MISSED', 'QADAA_DONE', 'PERCENT'].includes(todayRec.status));
      const defaultDate = todayLogged ? '2026-11-20' : TODAY_DATE;
      const latest = a.targets[a.targets.length - 1];

      document.getElementById('evolve-dialog-title').textContent = `تطوير هدف: ${a.title}`;
      document.getElementById('evolve-dialog-body').innerHTML = `
        <div class="panel-meta">الهدف الحالي: <strong>${latest ? latest.label : 'بدون هدف محدد'}</strong></div>
        <label style="display:flex;flex-direction:column;gap:4px">
          <span>الهدف الجديد</span>
          <input class="field-input" type="text" id="ev-label" placeholder="مثال: 30 صفحة أو 6 ركعات" />
        </label>
        <label style="display:flex;flex-direction:column;gap:4px">
          <span>نوع التغيير</span>
          <select class="field-select" id="ev-dir">
            <option value="level_up">ترقية للأعلى (يفعّل فترة تأقلم هدف جديد)</option>
            <option value="step_down">تخفيف مؤقت (امتحانات / سفر)</option>
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:4px">
          <span>يسري بدايةً من</span>
          <input class="field-input nums" type="date" id="ev-from" value="${defaultDate}" />
        </label>
        <div class="panel-meta">
          ${todayLogged
            ? 'تم اختيار الغد (20 نوفمبر) افتراضياً لأن اليوم مسجّل بالفعل على الهدف السابق.'
            : 'اليوم فارغ، لذلك يسري الهدف الجديد بدايةً من اليوم.'}
        </div>
      `;

      document.getElementById('evolve-dialog-save').onclick = () => {
        const lbl = document.getElementById('ev-label').value.trim();
        const from = document.getElementById('ev-from').value;
        const dir = document.getElementById('ev-dir').value;
        if (!lbl || !from) return;
        const existingIdx = a.targets.findIndex(t => t.from === from);
        const newV = { id: `tv_${Date.now()}`, from, label: lbl, dir };
        if (existingIdx >= 0) a.targets[existingIdx] = newV;
        else a.targets.push(newV);
        evolveDialog.close();
        showUndo(`تم تطوير هدف ${a.title} إلى ${lbl}`, () => {
          a.targets = a.targets.filter(t => t.id !== newV.id);
          render();
        });
        render();
      };

      evolveDialog.showModal();
    }

    // =========================================================================
    // Main Render Loop
    // =========================================================================
    function render() {
      renderChrome();
      const main = document.getElementById('app-main');
      if (state.screen === 'now') {
        main.innerHTML = renderNowScreen();
        wireNowEvents();
      } else if (state.screen === 'matrix') {
        main.innerHTML = renderMatrixScreen();
        wireMatrixEvents();
      } else if (state.screen === 'qadaa') {
        main.innerHTML = renderQadaaScreen();
        wireQadaaEvents();
      } else if (state.screen === 'analytics') {
        main.innerHTML = renderAnalyticsScreen();
        wireAnalyticsEvents();
      } else {
        main.innerHTML = renderSettingsScreen();
        wireSettingsEvents();
      }
    }

    seedInitialLogs();
    render();
  </script>
</body>
</html>
