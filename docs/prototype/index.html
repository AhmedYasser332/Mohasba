<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جدول المحاسبة — معاينة تفاعلية (المرحلة الثالثة)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230F5257' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18' rx='3'/%3E%3Cpolyline points='7 12.5 10.5 16 17 8.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Light Mode — Cool Mineral Chalk & Architectural Ledger */
      --bg-canvas: #F3F5F6;
      --bg-surface: #FFFFFF;
      --bg-subtle: #E9EDF0;
      --bg-hover: #E1E7EB;
      --border-hairline: #D5DCE1;
      --border-strong: #B6C2CA;
      --ink-primary: #11161A;
      --ink-secondary: #526068;
      --ink-muted: #687680;
      --ink-inverse: #FFFFFF;
      --accent-live: #0F5257;
      --accent-live-soft: #E3F0F1;

      /* 5-State + Unlogged Semantic Tokens (WCAG AA+) */
      --done-ink: #1A6B4B;
      --done-fill: #E7F3ED;
      --done-border: #B7DEC9;

      --missed-ink: #A8383B;
      --missed-fill: #F9EBEB;
      --missed-border: #E8C1C2;

      --qadaa-ink: #295985;
      --qadaa-fill: #EBF2F8;
      --qadaa-border: #BDD2E5;

      --percent-ink: #9A5B13;
      --percent-fill: #FBF2E6;
      --percent-border: #E5CCA8;

      --disabled-ink: #66727C;
      --disabled-fill: #ECEFF1;
      --disabled-border: #D5DCE1;

      --pending-border: #B8C2C9;
      --expired-ink: #855D25;
      --expired-fill: rgba(181, 137, 74, 0.08);
      --expired-border: #B5894A;

      /* Transient Elevation ONLY */
      --shadow-overlay: 0 6px 20px rgba(17, 22, 26, 0.14);

      /* Hierarchical Radii */
      --r-cell: 2px;
      --r-control: 6px;
      --r-panel: 8px;

      /* Typography & Motion */
      --font-sans: 'Readex Pro', system-ui, -apple-system, sans-serif;
      --t-fast: 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
      --sidebar-w: 228px;
    }

    [data-theme="dark"] {
      /* Dark Mode — Dimmed Graphite Charcoal (Low-Glare Fajr / Isha Comfort) */
      --bg-canvas: #16181C;
      --bg-surface: #1D2026;
      --bg-subtle: #242830;
      --bg-hover: #2C313B;
      --border-hairline: #2A2F38;
      --border-strong: #3A414D;
      --ink-primary: #D6DCE2;
      --ink-secondary: #8E98A4;
      --ink-muted: #76808C;
      --ink-inverse: #14171B;
      --accent-live: #58A4AA;
      --accent-live-soft: rgba(88, 164, 170, 0.13);
      --live-btn-bg: #1E5B60;
      --live-btn-ink: #EDF4F5;

      --done-ink: #64B88E;
      --done-fill: rgba(100, 184, 142, 0.10);
      --done-border: rgba(100, 184, 142, 0.22);

      --missed-ink: #DC8284;
      --missed-fill: rgba(220, 130, 132, 0.11);
      --missed-border: rgba(220, 130, 132, 0.24);

      --qadaa-ink: #79ABD6;
      --qadaa-fill: rgba(121, 171, 214, 0.11);
      --qadaa-border: rgba(121, 171, 214, 0.24);

      --percent-ink: #D4A459;
      --percent-fill: rgba(212, 164, 89, 0.11);
      --percent-border: rgba(212, 164, 89, 0.24);

      --disabled-ink: #727C88;
      --disabled-fill: #191C21;
      --disabled-border: #262B33;

      --pending-border: #383F4B;
      --expired-ink: #CCA05C;
      --expired-fill: rgba(204, 160, 92, 0.09);
      --expired-border: rgba(204, 160, 92, 0.36);

      --shadow-overlay: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      color-scheme: light dark;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Browser Surface Styling (Craft Floor) */
    ::selection {
      background-color: var(--accent-live-soft);
      color: var(--ink-primary);
    }

    input, textarea, select {
      font-family: inherit;
      caret-color: var(--accent-live);
    }

    a, button {
      font-family: inherit;
      text-underline-offset: 3px;
    }

    :focus-visible {
      outline: 2px solid var(--accent-live);
      outline-offset: 2px;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-canvas);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }

    .nums {
      font-variant-numeric: tabular-nums;
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .icon-sm {
      width: 15px;
      height: 15px;
    }

    /* Shell Architecture — Strict Desktop & Mobile Isolation */
    .app-shell {
      display: flex;
      min-height: 100dvh;
    }

    /* Desktop Right Sidebar Rail (RTL inline-start) */
    .desktop-rail {
      display: none;
    }

    @media (min-width: 1024px) {
      .desktop-rail {
        display: flex;
        flex-direction: column;
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: var(--bg-surface);
        border-inline-end: 1px solid var(--border-hairline);
        position: sticky;
        top: 0;
        height: 100dvh;
        padding-block: 16px;
        padding-inline: 12px;
        gap: 16px;
        transition: width var(--t-fast), padding var(--t-fast), opacity var(--t-fast);
        overflow: hidden;
      }

      .app-shell.sidebar-collapsed .desktop-rail {
        width: 0;
        padding-inline: 0;
        border-inline-end-color: transparent;
        opacity: 0;
        pointer-events: none;
      }
    }

    .brand-block {
      padding-inline: 6px;
      padding-block-end: 12px;
      border-block-end: 1px solid var(--border-hairline);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .desktop-sidebar-trigger,
    .desktop-only {
      display: none !important;
    }

    @media (min-width: 1024px) {
      .desktop-only {
        display: inline-flex !important;
      }
      .desktop-sidebar-trigger {
        display: inline-flex !important;
      }
      .app-shell:not(.sidebar-collapsed) .top-bar .desktop-sidebar-trigger {
        display: none !important;
      }
      .app-shell.sidebar-collapsed .top-bar-end {
        display: flex;
      }
    }

    /* Crisp Native-Like Tooltip for Keyboard Shortcut Discovery */
    .has-tip {
      position: relative;
    }
    .has-tip::after {
      content: attr(data-tip);
      position: absolute;
      inset-block-start: calc(100% + 6px);
      inset-inline-start: 0;
      background: var(--ink-primary);
      color: var(--ink-inverse);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: var(--r-cell);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t-fast);
      z-index: 40;
    }
    .has-tip:hover::after,
    .has-tip:focus-visible::after {
      opacity: 1;
    }

    .brand-title {
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .brand-note {
      margin: 4px 0 0;
      font-size: 0.75rem;
      color: var(--ink-secondary);
    }

    .rail-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding-block: 10px;
      padding-inline: 10px;
      border: 1px solid transparent;
      border-radius: var(--r-control);
      background: transparent;
      color: var(--ink-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--t-fast), color var(--t-fast), border-color var(--t-fast);
      text-align: start;
    }

    .nav-btn-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .nav-btn[aria-current="page"] {
      background: var(--accent-live-soft);
      color: var(--accent-live);
      border-color: var(--border-hairline);
      font-weight: 600;
    }

    .count-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding-inline: 6px;
      border-radius: var(--r-cell);
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .count-chip.alert {
      background: var(--missed-fill);
      color: var(--missed-ink);
      border: 1px solid var(--missed-border);
    }

    .rail-footer {
      border-block-start: 1px solid var(--border-hairline);
      padding-block-start: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Main Column */
    .main-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding-block-end: 74px;
    }

    @media (min-width: 1024px) {
      .main-col {
        padding-block-end: 32px;
      }
    }

    /* Top Utility Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg-surface);
      border-block-end: 1px solid var(--border-hairline);
      padding-block: 10px;
      padding-inline: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    @media (min-width: 1024px) {
      .top-bar {
        padding-inline: 28px;
      }
    }

    .top-bar-start {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .page-heading {
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (min-width: 1024px) {
      .page-heading {
        font-size: 1.25rem;
      }
    }

    .demo-tag {
      font-size: 0.75rem;
      color: var(--ink-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-cell);
      padding: 2px 7px;
      white-space: nowrap;
      display: none;
    }

    @media (min-width: 640px) {
      .demo-tag {
        display: inline-block;
      }
    }

    .top-bar-end {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    @media (min-width: 1024px) {
      .top-bar-end {
        display: none;
      }
    }

    /* Buttons & Controls */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding-block: 6px;
      padding-inline: 12px;
      border-radius: var(--r-control);
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast), opacity var(--t-fast);
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
    }

    .btn:active:not(:disabled) {
      opacity: 0.86;
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--ink-primary);
      color: var(--ink-inverse);
      border-color: var(--ink-primary);
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      background: var(--ink-primary);
      border-color: var(--ink-primary);
    }

    .btn-live {
      background: var(--accent-live);
      color: #FFFFFF;
      border-color: var(--accent-live);
    }

    [data-theme="dark"] .btn-live {
      background: var(--live-btn-bg);
      border-color: var(--live-btn-bg);
      color: var(--live-btn-ink);
      font-weight: 600;
    }

    .btn-live:hover:not(:disabled) {
      opacity: 0.92;
      background: var(--accent-live);
      border-color: var(--accent-live);
    }

    .btn-icon {
      min-width: 38px;
      min-height: 38px;
      padding: 0;
    }

    /* 4-State Sync Visibility Control */
    .sync-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding-block: 4px;
      padding-inline: 10px;
      border-radius: var(--r-control);
      border: 1px solid var(--border-hairline);
      background: var(--bg-subtle);
      color: var(--ink-primary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--t-fast), border-color var(--t-fast);
    }

    .sync-btn:hover {
      background: var(--bg-hover);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      background: var(--done-ink);
      flex-shrink: 0;
    }

    .sync-btn[data-sync="offline"] {
      background: var(--percent-fill);
      border-color: var(--percent-border);
      color: var(--percent-ink);
    }
    .sync-btn[data-sync="offline"] .sync-dot {
      background: var(--percent-ink);
    }

    .sync-btn[data-sync="attention"] {
      background: var(--missed-fill);
      border-color: var(--missed-border);
      color: var(--missed-ink);
    }
    .sync-btn[data-sync="attention"] .sync-dot {
      background: var(--missed-ink);
    }

    /* Content Workspace */
    .workspace {
      width: 100%;
      max-width: 1220px;
      margin-inline: auto;
      padding-block: 16px;
      padding-inline: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 1024px) {
      .workspace {
        padding-block: 22px;
        padding-inline: 28px;
        gap: 20px;
      }
    }

    /* Mobile Bottom Navigation (44px+ touch targets) */
    .mobile-nav {
      position: fixed;
      inset-block-end: 0;
      inset-inline: 0;
      z-index: 30;
      background: var(--bg-surface);
      border-block-start: 1px solid var(--border-hairline);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding-block: 4px;
      padding-block-end: max(4px, env(safe-area-inset-bottom));
    }

    @media (min-width: 1024px) {
      .mobile-nav {
        display: none;
      }
    }

    .mobile-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 52px;
      border: none;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
    }

    .mobile-nav-btn[aria-current="page"] {
      color: var(--accent-live);
      font-weight: 600;
    }

    .mobile-badge {
      position: absolute;
      top: 5px;
      inset-inline-end: 18%;
      min-width: 16px;
      height: 16px;
      padding-inline: 4px;
      border-radius: var(--r-cell);
      background: var(--missed-ink);
      color: #FFFFFF;
      font-size: 0.65rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Structural Panels (Zero Resting Shadow, Hairline Only) */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-panel);
      overflow: hidden;
    }

    .panel-header {
      padding-block: 12px;
      padding-inline: 16px;
      background: var(--bg-subtle);
      border-block-end: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .panel-title {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .panel-meta {
      font-size: 0.75rem;
      color: var(--ink-secondary);
    }

    /* Screen 1: Joi Day Strip */
    .day-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .day-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 54px;
      padding-block: 6px;
      padding-inline: 2px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-control);
      background: var(--bg-surface);
      color: var(--ink-secondary);
      cursor: pointer;
      transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast);
    }

    .day-tile:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .day-tile[aria-pressed="true"] {
      background: var(--ink-primary);
      color: var(--ink-inverse);
      border-color: var(--ink-primary);
    }

    .day-tile-name {
      font-size: 0.72rem;
      font-weight: 500;
    }

    .day-tile-num {
      font-size: 0.875rem;
      font-weight: 700;
    }

    .day-tile-dot {
      width: 5px;
      height: 5px;
      border-radius: 9999px;
      background: var(--accent-live);
    }

    .day-tile[aria-pressed="true"] .day-tile-dot {
      background: var(--ink-inverse);
    }

    /* Period Switcher Tabs */
    .period-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-block-end: 2px;
      scrollbar-width: none;
    }
    .period-strip::-webkit-scrollbar {
      display: none;
    }

    .period-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding-block: 6px;
      padding-inline: 12px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-control);
      background: var(--bg-surface);
      color: var(--ink-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast);
    }

    .period-pill:hover {
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .period-pill[aria-selected="true"] {
      background: var(--accent-live-soft);
      border-color: var(--accent-live);
      color: var(--accent-live);
      font-weight: 600;
    }

    .live-indicator {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: var(--accent-live);
    }

    /* Catch-Up Banner (48h Unlogged) */
    .catchup-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-block: 10px;
      padding-inline: 14px;
      background: var(--bg-surface);
      border: 1px dashed var(--expired-border);
      border-radius: var(--r-panel);
      flex-wrap: wrap;
    }

    .catchup-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8125rem;
      color: var(--expired-ink);
      font-weight: 500;
    }

    /* Signature Craft Detail — 2px Time-Window Horizon Rail */
    .window-header {
      position: relative;
      padding-block: 14px 16px;
      padding-inline: 16px;
      background: var(--bg-surface);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .window-title {
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .window-time-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8125rem;
      color: var(--ink-secondary);
    }

    .window-countdown {
      font-weight: 600;
      color: var(--accent-live);
    }

    .window-countdown.closing {
      color: var(--percent-ink);
    }

    .horizon-track {
      position: absolute;
      inset-block-end: 0;
      inset-inline: 0;
      height: 2px;
      background: var(--border-hairline);
    }

    .horizon-fill {
      height: 100%;
      background: var(--accent-live);
      transition: width var(--t-fast), background-color var(--t-fast);
    }

    .horizon-fill.closing {
      background: var(--percent-ink);
    }

    /* Quick Action Split Bar */
    .quick-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-block: 10px;
      padding-inline: 16px;
      background: var(--bg-subtle);
      border-block-end: 1px solid var(--border-hairline);
    }

    @media (max-width: 420px) {
      .quick-split {
        grid-template-columns: 1fr;
      }
    }

    .quick-split .btn {
      min-height: 44px;
      font-size: 0.8125rem;
    }

    /* WHOOP-Style Action Rows (Divide-Y, Zero Card Nesting) */
    .action-list {
      display: flex;
      flex-direction: column;
    }

    .action-row {
      padding-block: 11px;
      padding-inline: 16px;
      border-block-end: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-surface);
      transition: background-color var(--t-fast);
    }

    .action-row:last-child {
      border-block-end: none;
    }

    .action-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .action-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .action-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-title {
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--ink-primary);
    }

    .action-row.is-disabled .action-title {
      color: var(--disabled-ink);
      text-decoration: line-through;
    }

    .target-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: var(--r-cell);
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      font-size: 0.72rem;
      color: var(--ink-secondary);
      font-weight: 500;
    }

    .new-target-tag {
      background: var(--qadaa-fill);
      border-color: var(--qadaa-border);
      color: var(--qadaa-ink);
    }

    .action-sub-line {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* WHOOP 7-Day Mini-Dots (Strictly 6px circles) */
    .week-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .w-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: var(--border-hairline);
    }
    .w-dot.done { background: var(--done-ink); }
    .w-dot.missed { background: var(--missed-ink); }
    .w-dot.qadaa { background: var(--qadaa-ink); }
    .w-dot.percent { background: var(--percent-ink); }
    .w-dot.disabled { background: var(--disabled-border); opacity: 0.6; }
    .w-dot.expired { background: var(--expired-border); }

    .row-note-preview {
      font-size: 0.72rem;
      color: var(--ink-secondary);
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Inline Thumb Controls (44x44px Mobile Safe) */
    .action-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tap-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--r-control);
      border: 1px solid var(--border-hairline);
      background: var(--bg-canvas);
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast);
    }

    .tap-btn:hover {
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .tap-btn.active-done {
      background: var(--done-fill);
      border-color: var(--done-border);
      color: var(--done-ink);
    }

    .tap-btn.active-missed {
      background: var(--missed-fill);
      border-color: var(--missed-border);
      color: var(--missed-ink);
    }

    .tap-btn.active-qadaa {
      background: var(--qadaa-fill);
      border-color: var(--qadaa-border);
      color: var(--qadaa-ink);
    }

    .tap-btn.active-disabled {
      background: var(--disabled-fill);
      border-color: var(--disabled-border);
      color: var(--disabled-ink);
    }

    .tap-btn-more {
      width: 34px;
      height: 44px;
      background: transparent;
      border-color: transparent;
    }

    .tap-btn-more:hover {
      background: var(--bg-subtle);
      border-color: var(--border-hairline);
    }

    /* Inline Percentage Chip Bar */
    .pct-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pct-chip {
      position: relative;
      min-height: 34px;
      min-width: 48px;
      padding-block: 4px;
      padding-inline: 9px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-cell);
      background: var(--bg-canvas);
      color: var(--ink-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      transition: background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast);
    }

    .pct-chip:hover {
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .pct-chip.selected-pct {
      background: var(--percent-fill);
      border-color: var(--percent-border);
      color: var(--percent-ink);
    }

    .pct-chip.selected-done {
      background: var(--done-fill);
      border-color: var(--done-border);
      color: var(--done-ink);
    }

    .pct-chip.selected-missed {
      background: var(--missed-fill);
      border-color: var(--missed-border);
      color: var(--missed-ink);
    }

    .pct-chip-fill {
      position: absolute;
      inset-block-end: 0;
      inset-inline-start: 0;
      height: 3px;
      background: var(--percent-ink);
    }

    /* Sub-header for Bound Left-Side Habits */
    .sub-band {
      padding-block: 8px;
      padding-inline: 16px;
      background: var(--bg-subtle);
      border-block: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    /* Screen 2: Weekly Matrix (Desktop Syncra Table + Mobile WHOOP Ledger) */
    .matrix-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .matrix-toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .matrix-desktop-wrap {
      display: none;
    }

    .matrix-mobile-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 1024px) {
      .matrix-desktop-wrap {
        display: block;
      }
      .matrix-mobile-wrap {
        display: none;
      }
    }

    .matrix-mobile-wrap.force-grid .mobile-ledger-view {
      display: none;
    }
    .matrix-mobile-wrap:not(.force-grid) .mobile-compact-table {
      display: none;
    }

    .ledger-table-wrap {
      overflow-x: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-panel);
    }

    table.ledger-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.8125rem;
    }

    .ledger-table thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg-subtle);
      border-block-end: 1px solid var(--border-hairline);
      padding-block: 9px;
      padding-inline: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-secondary);
      text-align: center;
    }

    .ledger-table thead th.col-action {
      width: 34%;
      text-align: start;
      padding-inline-start: 14px;
    }

    .ledger-table thead th.col-day.is-today {
      color: var(--accent-live);
      background: var(--accent-live-soft);
    }

    .ledger-table thead th.col-rate {
      width: 9%;
    }

    .ledger-table tbody tr.side-divider td {
      padding: 0;
      height: 2px;
      background: var(--ink-primary);
    }

    .ledger-table tbody tr.side-label-row td {
      background: var(--bg-canvas);
      padding-block: 8px;
      padding-inline: 14px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink-secondary);
      border-block-end: 1px solid var(--border-hairline);
    }

    .ledger-table tbody tr.group-row td {
      background: var(--bg-subtle);
      padding: 0;
      border-block-end: 1px solid var(--border-hairline);
    }

    .group-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 8px;
      padding-inline: 14px;
      border: none;
      background: transparent;
      color: var(--ink-primary);
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .group-toggle-start {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ledger-table tbody tr.data-row {
      height: 38px;
      border-block-end: 1px solid var(--border-hairline);
    }

    .ledger-table tbody tr.data-row:hover {
      background: var(--bg-canvas);
    }

    .ledger-table td.cell-title {
      padding-block: 4px;
      padding-inline: 14px 8px;
      color: var(--ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ledger-table td.cell-status {
      padding: 3px;
      text-align: center;
    }

    .ledger-table td.cell-rate {
      text-align: center;
      font-weight: 600;
      color: var(--ink-secondary);
      padding-inline: 6px;
    }

    /* Matrix Cell & Mobile Circle Shared States (Zero Clipping / Zero Overflow) */
    .m-cell {
      position: relative;
      width: 100%;
      height: 30px;
      border-radius: var(--r-cell);
      border: 1px solid transparent;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      transition: background-color var(--t-fast), border-color var(--t-fast);
    }

    .m-cell.st-done,
    .m-whoop-circle.st-done {
      background: var(--done-fill);
      border-color: var(--done-border);
      color: var(--done-ink);
    }
    .m-cell.st-missed,
    .m-whoop-circle.st-missed {
      background: var(--missed-fill);
      border-color: var(--missed-border);
      color: var(--missed-ink);
    }
    .m-cell.st-qadaa,
    .m-whoop-circle.st-qadaa {
      background: var(--qadaa-fill);
      border-color: var(--qadaa-border);
      color: var(--qadaa-ink);
    }
    .m-cell.st-percent,
    .m-whoop-circle.st-percent {
      background: var(--percent-fill);
      border-color: var(--percent-border);
      color: var(--percent-ink);
    }
    .m-cell.st-disabled,
    .m-whoop-circle.st-disabled {
      background: var(--disabled-fill);
      border-color: var(--disabled-border);
      color: var(--disabled-ink);
    }
    .m-cell.st-pending,
    .m-whoop-circle.st-pending {
      background: transparent;
      border: 1px dashed var(--pending-border);
      color: var(--ink-muted);
    }
    .m-cell.st-expired,
    .m-whoop-circle.st-expired {
      background: var(--expired-fill);
      border: 1px dashed var(--expired-border);
      color: var(--expired-ink);
    }

    .app-shell.overview-active .main-col {
      padding-block-end: 6px;
    }

    .app-shell.overview-active .top-bar {
      padding-block: 6px;
    }

    /* Bird's-Eye One-Glance Sheet Mode (Zero Scroll Side-by-Side Desktop View) */
    .workspace.overview-wide {
      max-width: 100%;
      padding-block: 6px;
      padding-inline: 14px;
      gap: 6px;
    }

    .overview-split {
      display: grid;
      grid-template-columns: 1.24fr 1fr;
      gap: 10px;
      align-items: start;
    }

    .overview-split .ledger-table {
      font-size: 0.72rem;
    }

    .overview-split .ledger-table thead th {
      padding-block: 4px;
      padding-inline: 2px;
      font-size: 0.67rem;
    }

    .overview-split .ledger-table thead th.col-period {
      width: 10%;
      text-align: center;
    }

    .overview-split .ledger-table thead th.col-action {
      width: 31%;
      padding-inline-start: 6px;
    }

    .overview-split .ledger-table thead th.col-rate {
      width: 7%;
    }

    .overview-split .ledger-table td.cell-period {
      background: var(--bg-subtle);
      border-inline-end: 1px solid var(--border-hairline);
      border-block-end: 1px solid var(--border-strong);
      text-align: center;
      font-weight: 700;
      font-size: 0.7rem;
      color: var(--ink-primary);
      padding-inline: 4px;
      vertical-align: middle;
    }

    .overview-split .ledger-table td.cell-period.is-live-period {
      background: var(--accent-live-soft);
      color: var(--accent-live);
    }

    .overview-split .ledger-table tbody tr.period-end-row {
      border-block-end: 1px solid var(--border-strong);
    }

    .overview-split .ledger-table tbody tr.data-row {
      height: 21px;
    }

    .overview-split .ledger-table td.cell-title {
      padding-block: 0;
      padding-inline: 6px 4px;
    }

    .overview-split .ledger-table td.cell-status {
      padding: 1px;
    }

    .overview-split .m-cell {
      height: 17px;
      font-size: 0.64rem;
    }

    .overview-split .m-cell .icon-sm {
      width: 12px;
      height: 12px;
    }

    .overview-split .ledger-table td.cell-rate {
      font-size: 0.67rem;
      padding-inline: 2px;
    }

    .overview-split .target-tag {
      font-size: 0.63rem;
      padding: 0 4px;
    }

    .m-cell-bar {
      position: absolute;
      inset-block-end: 0;
      inset-inline-start: 0;
      height: 3px;
      background: var(--percent-ink);
    }

    /* Mobile WHOOP 7-Day Circle Row */
    .m-whoop-row {
      padding-block: 10px;
      padding-inline: 14px;
      border-block-end: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-surface);
    }
    .m-whoop-row:last-child { border-block-end: none; }

    .m-whoop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .m-whoop-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .m-whoop-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: none;
      background: transparent;
      padding: 2px 0;
      cursor: pointer;
    }

    .m-whoop-day-lbl {
      font-size: 0.68rem;
      color: var(--ink-secondary);
    }

    .m-whoop-circle {
      position: relative;
      overflow: hidden;
      width: 34px;
      height: 34px;
      border-radius: var(--r-control);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid var(--border-hairline);
    }

    /* Segmented Tabs (Screen 3 & 4) */
    .seg-tabs {
      display: inline-flex;
      padding: 3px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-control);
      gap: 3px;
      flex-wrap: wrap;
    }

    .seg-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding-block: 4px;
      padding-inline: 12px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color var(--t-fast), color var(--t-fast);
    }

    .seg-tab[aria-selected="true"] {
      background: var(--bg-surface);
      border-color: var(--border-hairline);
      color: var(--ink-primary);
      font-weight: 600;
    }

    /* Screen 3: Qadaa Rows */
    .qadaa-row {
      padding-block: 12px;
      padding-inline: 16px;
      border-block-end: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .qadaa-row:last-child { border-block-end: none; }

    .qadaa-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .qadaa-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--ink-secondary);
    }

    .qadaa-snapshot {
      background: var(--qadaa-fill);
      border: 1px solid var(--qadaa-border);
      color: var(--qadaa-ink);
      padding: 1px 6px;
      border-radius: var(--r-cell);
      font-weight: 600;
    }

    /* Screen 4: Analytics Grid (3 Lean Insights) */
    .pulse-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-block-start: 1px solid var(--border-hairline);
    }

    @media (max-width: 720px) {
      .pulse-grid {
        grid-template-columns: 1fr;
      }
    }

    .pulse-cell {
      padding: 16px;
      border-inline-end: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pulse-cell:last-child {
      border-inline-end: none;
    }

    @media (max-width: 720px) {
      .pulse-cell {
        border-inline-end: none;
        border-block-end: 1px solid var(--border-hairline);
      }
      .pulse-cell:last-child {
        border-block-end: none;
      }
    }

    .pulse-label {
      font-size: 0.8125rem;
      color: var(--ink-secondary);
      font-weight: 500;
    }

    .pulse-num {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ink-primary);
      line-height: 1.2;
    }

    .pulse-detail {
      font-size: 0.75rem;
      color: var(--ink-secondary);
    }

    .analytics-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .analytics-split {
        grid-template-columns: 1fr;
      }
    }

    .bar-row {
      padding-block: 10px;
      padding-inline: 16px;
      border-block-end: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bar-row:last-child { border-block-end: none; }

    .bar-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8125rem;
    }

    .bar-track {
      height: 6px;
      background: var(--bg-subtle);
      border-radius: var(--r-cell);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent-live);
      transition: width var(--t-fast);
    }

    .bar-fill.weak { background: var(--missed-ink); }
    .bar-fill.mid { background: var(--percent-ink); }
    .bar-fill.good { background: var(--done-ink); }

    .sub-split-note {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.72rem;
      color: var(--ink-secondary);
    }

    .progression-trail {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--qadaa-ink);
      background: var(--qadaa-fill);
      border: 1px solid var(--qadaa-border);
      border-radius: var(--r-cell);
      padding: 2px 8px;
      width: fit-content;
    }

    /* Screen 5: Settings */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 1024px) {
      .settings-grid {
        grid-template-columns: 1.2fr 1fr;
        align-items: start;
      }
    }

    .offline-guard {
      padding: 12px 16px;
      background: var(--percent-fill);
      border: 1px solid var(--percent-border);
      border-radius: var(--r-panel);
      color: var(--percent-ink);
      font-size: 0.8125rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .setting-row {
      padding-block: 11px;
      padding-inline: 16px;
      border-block-end: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .setting-row:last-child { border-block-end: none; }

    .field-input, .field-select {
      min-height: 36px;
      padding-block: 6px;
      padding-inline: 10px;
      border-radius: var(--r-control);
      border: 1px solid var(--border-hairline);
      background: var(--bg-canvas);
      color: var(--ink-primary);
      font-size: 0.8125rem;
    }

    .switch-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.8125rem;
    }

    .switch-toggle input {
      accent-color: var(--accent-live);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .ntfy-preview {
      margin: 12px 16px 14px;
      padding: 12px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--r-control);
      font-size: 0.8125rem;
    }

    /* Transient 5-Second Undo Toast */
    .undo-toast {
      position: fixed;
      inset-block-end: 68px;
      inset-inline: 14px;
      max-width: 440px;
      margin-inline: auto;
      z-index: 50;
      background: var(--ink-primary);
      color: var(--ink-inverse);
      border-radius: var(--r-panel);
      box-shadow: var(--shadow-overlay);
      overflow: hidden;

      historicalQadaa: [

        { id: 'hq_2', actionId: 'isha_witr', date: '2026-11-11', dayLabel: 'الأربعاء 11 نوفمبر', targetLabel: 'ركعة بـ 10 آيات', status: 'MISSED', ageDays: 8 }
